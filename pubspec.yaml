name: stock_research_app
description: "AI Stock Research Platform — mobile client (Phase 1: market data viewer)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1

  # Event transformers (debounce/switchMap for Bloc event handling)
  stream_transform: ^2.1.0

  # Local persistence (watchlist)
  shared_preferences: ^2.2.3

  # Charts (OHLCV candle visualisation)
  fl_chart: ^0.68.0

  # Dependency injection (simple service locator)
  get_it: ^7.7.0

  # Value formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
